name: Verify Orbit
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * 1'

permissions:
  contents: read

concurrency:
  group: orbit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/verify

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review new dependencies for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          license-check: false
          comment-summary-in-pr: never

  owasp-additional:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Report optional full-scan configuration
        if: env.NVD_API_KEY == ''
        run: echo "::notice::Optional OWASP scan skipped because NVD_API_KEY is not configured. The separate runtime Trivy gate and SBOM remain enabled without this secret."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.NVD_API_KEY != ''
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: env.NVD_API_KEY != ''
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
        if: env.NVD_API_KEY != ''
      - name: Scan runtime dependencies for known vulnerabilities
        if: env.NVD_API_KEY != ''
        run: >-
          ./mvnw -B -ntp org.owasp:dependency-check-maven:12.2.2:check
          -DnvdApiKey="$NVD_API_KEY"
          -DfailBuildOnCVSS=7
          -Dformat=HTML
          -DskipTestScope=true
          -DskipProvidedScope=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && env.NVD_API_KEY != ''
        with:
          name: dependency-security-report
          path: target/dependency-check-report.html
