name: Verify Orbit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * 1'

permissions:
  contents: read

concurrency:
  group: orbit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - name: H2 tests and executable artifact
        run: ./mvnw -B -ntp verify
      - name: PostgreSQL integration tests with Testcontainers
        run: ./mvnw -B -ntp -Ppostgres-tests verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Check browser source formatting
        run: npm run format:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated browser-test mail sink
        run: |
          mail_key=$(openssl rand -base64 32)
          echo "::add-mask::$mail_key"
          echo "ORBIT_MAIL_ENCRYPTION_KEY=$mail_key" >> "$GITHUB_ENV"
          docker run -d --name orbit-browser-mailpit \
            -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 axllent/mailpit:v1.31.3
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8025/api/v1/messages >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Mailpit did not become ready.' >&2
          exit 1
      - name: Browser workflow and mobile tests
        run: npm run test:e2e
        env:
          SPRING_APPLICATION_JSON: '{"orbit":{"auth":{"rate-limit-enabled":false}}}'
          ORBIT_MAIL_ENABLED: 'true'
          ORBIT_MAIL_HOST: 127.0.0.1
          ORBIT_MAIL_PORT: '1025'
          ORBIT_MAIL_STARTTLS: 'false'
          ORBIT_MAIL_FROM: orbit@example.test
          ORBIT_PUBLIC_BASE_URL: http://127.0.0.1:8080
          ORBIT_MAILPIT_URL: http://127.0.0.1:8025
      - name: Stop browser-test mail sink
        if: always()
        run: docker rm -f orbit-browser-mailpit 2>/dev/null || true
      - name: Build production image
        run: docker build -t orbit:${{ github.sha }} .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            playwright-report/
            test-results/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Review new dependencies for known vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          license-check: false
          comment-summary-in-pr: never

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Report optional full-scan configuration
        if: env.NVD_API_KEY == ''
        run: echo "::notice::OWASP full dependency scan skipped because NVD_API_KEY is not configured. Pull requests still run native dependency review."
      - uses: actions/checkout@v4
        if: env.NVD_API_KEY != ''
      - uses: actions/setup-java@v4
        if: env.NVD_API_KEY != ''
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
        if: env.NVD_API_KEY != ''
      - name: Scan runtime dependencies for known vulnerabilities
        if: env.NVD_API_KEY != ''
        run: >-
          ./mvnw -B -ntp org.owasp:dependency-check-maven:12.2.2:check
          -DnvdApiKey="$NVD_API_KEY"
          -DfailBuildOnCVSS=7
          -Dformat=HTML
          -DskipTestScope=true
          -DskipProvidedScope=true
      - uses: actions/upload-artifact@v4
        if: always() && env.NVD_API_KEY != ''
        with:
          name: dependency-security-report
          path: target/dependency-check-report.html