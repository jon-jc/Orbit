name: Verify Orbit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * 1'

permissions:
  contents: read

concurrency:
  group: orbit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - name: H2 tests and executable artifact
        run: ./mvnw -B -ntp verify
      - name: PostgreSQL integration tests with Testcontainers
        run: ./mvnw -B -ntp -Ppostgres-tests verify
      - name: Validate OpenAPI contract
        run: |
          python3 -m venv .openapi-venv
          .openapi-venv/bin/pip install -r api/requirements-validation.txt
          .openapi-venv/bin/python api/validate.py
      - name: Verify isolated PostgreSQL backup and restore
        run: |
          sh -n scripts/backup.sh scripts/restore.sh scripts/test-recovery.sh
          sh scripts/test-recovery.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Check browser source formatting
        run: npm run format:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated browser-test mail sink
        run: |
          mail_key=$(openssl rand -base64 32)
          echo "::add-mask::$mail_key"
          echo "ORBIT_MAIL_ENCRYPTION_KEY=$mail_key" >> "$GITHUB_ENV"
          docker run -d --name orbit-browser-mailpit \
            -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 axllent/mailpit:v1.31.3
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8025/api/v1/messages >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Mailpit did not become ready.' >&2
          exit 1
      - name: Browser workflow and mobile tests
        run: npm run test:e2e
        env:
          SPRING_APPLICATION_JSON: '{"orbit":{"auth":{"rate-limit-enabled":false}}}'
          ORBIT_MAIL_ENABLED: 'true'
          ORBIT_MAIL_HOST: 127.0.0.1
          ORBIT_MAIL_PORT: '1025'
          ORBIT_MAIL_STARTTLS: 'false'
          ORBIT_MAIL_FROM: orbit@example.test
          ORBIT_PUBLIC_BASE_URL: http://127.0.0.1:8080
          ORBIT_MAILPIT_URL: http://127.0.0.1:8025
      - name: Stop browser-test mail sink
        if: always()
        run: docker rm -f orbit-browser-mailpit 2>/dev/null || true
      - name: Build production image
        id: runtime-image
        run: docker build -t orbit:${{ github.sha }} .
      - name: Generate runtime CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: orbit:${{ github.sha }}
          scanners: vuln
          format: cyclonedx
          output: runtime.sbom.json
          exit-code: '0'
      - name: Gate runtime OS and Java vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: orbit:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: runtime-vulnerabilities.json
          exit-code: '1'
          skip-setup-trivy: true
      - name: Preserve runtime security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.runtime-image.outcome == 'success'
        with:
          name: runtime-security-reports
          path: |
            runtime.sbom.json
            runtime-vulnerabilities.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            playwright-report/
            test-results/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review new dependencies for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          license-check: false
          comment-summary-in-pr: never

  owasp-additional:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Report optional full-scan configuration
        if: env.NVD_API_KEY == ''
        run: echo "::notice::Optional OWASP scan skipped because NVD_API_KEY is not configured. The runtime Trivy scan and SBOM still run without this secret."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.NVD_API_KEY != ''
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: env.NVD_API_KEY != ''
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
        if: env.NVD_API_KEY != ''
      - name: Scan runtime dependencies for known vulnerabilities
        if: env.NVD_API_KEY != ''
        run: >-
          ./mvnw -B -ntp org.owasp:dependency-check-maven:12.2.2:check
          -DnvdApiKey="$NVD_API_KEY"
          -DfailBuildOnCVSS=7
          -Dformat=HTML
          -DskipTestScope=true
          -DskipProvidedScope=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && env.NVD_API_KEY != ''
        with:
          name: dependency-security-report
          path: target/dependency-check-report.html