openapi: 3.1.0
info:
  title: Orbit API
  version: 1.0.0
  description: Same-origin, session-authenticated project workspace. Mutations require CSRF, including
    public authentication operations. Required text is nonblank, domain/display-name text rejects U+0000,
    API payloads are capped at 64 KiB. Owners manage team/settings/invitations; owners/members edit projects/tasks
    and add comments; viewers read/export. IDs are scoped to membership; inaccessible workspaces return
    404.
servers:
- url: /
tags:
- name: Authentication
- name: Account
- name: Workspaces
- name: Team
- name: Projects
- name: Tasks
- name: Activity
- name: Invitations
- name: Notifications
paths:
  /api/auth/csrf:
    get:
      operationId: getCsrf
      tags:
      - Authentication
      summary: Create/get session-bound CSRF token
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '400':
          $ref: '#/components/responses/Problem400'
        '403':
          $ref: '#/components/responses/Problem403'
        '500':
          $ref: '#/components/responses/Problem500'
  /api/auth/config:
    get:
      operationId: getAuthConfig
      tags:
      - Authentication
      summary: Read enabled authentication features
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        '400':
          $ref: '#/components/responses/Problem400'
        '403':
          $ref: '#/components/responses/Problem403'
        '500':
          $ref: '#/components/responses/Problem500'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - Authentication
      summary: Read current authenticated user
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
  /api/auth/register:
    post:
      operationId: registerAccount
      tags:
      - Authentication
      summary: Register without automatic sign-in
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem400'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      description: Public operation requires the anonymous session cookie and CSRF token issued by GET
        /api/auth/csrf; no authenticated account is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
  /api/auth/login:
    post:
      operationId: login
      tags:
      - Authentication
      summary: Authenticate and rotate session ID
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem400'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '401':
          $ref: '#/components/responses/Problem401'
      description: Public operation requires the anonymous session cookie and CSRF token issued by GET
        /api/auth/csrf; no authenticated account is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - Authentication
      summary: Invalidate session
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /api/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags:
      - Authentication
      summary: Request a password-reset message
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Problem400'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      description: 'Generic accepted response avoids disclosing whether an account exists. Reset tokens
        expire after 30 minutes by default; the TTL is configurable.


        Public operation requires the anonymous session cookie and CSRF token issued by GET /api/auth/csrf;
        no authenticated account is required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
  /api/auth/reset-password:
    post:
      operationId: resetPassword
      tags:
      - Authentication
      summary: Consume reset token and replace password
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Problem400'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      description: Public operation requires the anonymous session cookie and CSRF token issued by GET
        /api/auth/csrf; no authenticated account is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
  /api/auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
      - Authentication
      summary: Consume email-verification token
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Problem400'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      description: Public operation requires the anonymous session cookie and CSRF token issued by GET
        /api/auth/csrf; no authenticated account is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /api/auth/resend-verification:
    post:
      operationId: resendVerification
      tags:
      - Authentication
      summary: Request another verification message
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Problem400'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      description: Public operation requires the anonymous session cookie and CSRF token issued by GET
        /api/auth/csrf; no authenticated account is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
  /api/account:
    get:
      operationId: getAccount
      tags:
      - Account
      summary: Read current account profile
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
    patch:
      operationId: updateAccount
      tags:
      - Account
      summary: Update display name
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '500':
          $ref: '#/components/responses/Problem500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccount'
