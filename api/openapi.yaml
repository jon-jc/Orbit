        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /api/account/sessions:
    get:
      operationId: listAccountSessions
      tags:
      - Account
      summary: List up to 100 active sessions, most recently accessed first
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSession'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
      description: The opaque row id is a revocation identifier, never the cookie/session credential.
  /api/account/sessions/{sessionId}:
    delete:
      operationId: revokeAccountSession
      tags:
      - Account
      summary: Revoke an actor-owned session
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '500':
          $ref: '#/components/responses/Problem500'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Unknown or another account's id returns 404. Revoking the current session invalidates
        its browser authentication.
  /api/workspaces:
    get:
      operationId: listWorkspaces
      tags:
      - Workspaces
      summary: List actor memberships
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
    post:
      operationId: createWorkspace
      tags:
      - Workspaces
      summary: Create a workspace owned by the actor
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '500':
          $ref: '#/components/responses/Problem500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspace'
  /api/workspaces/{workspaceId}/settings:
    get:
      operationId: getWorkspaceSettings
      tags:
      - Workspaces
      summary: Read workspace settings and version
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettings'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
      parameters: &id001
      - &id002
        name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWorkspaceSettings
      tags:
      - Workspaces
      summary: 'Owner: rename using current version'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettings'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '500':
          $ref: '#/components/responses/Problem500'
      parameters: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspace'
  /api/workspaces/{workspaceId}/members:
    get:
      operationId: listMembers
      tags:
      - Team
      summary: Read workspace membership
      security:
      - sessionCookie: []
      responses:
