components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ORBIT_SESSION
      description: HttpOnly, SameSite=Lax server-managed session cookie. GET csrf issues an anonymous
        session; login rotates it into an authenticated session. Secure in production.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Token from GET /api/auth/csrf. Refresh after login/logout.
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        emailVerified:
          type: boolean
      required:
      - id
      - name
      - email
      - emailVerified
    Csrf:
      type: object
      properties:
        token:
          type: string
        headerName:
          type: string
          examples:
          - X-CSRF-TOKEN
      required:
      - token
      - headerName
    AuthConfig:
      type: object
      properties:
        demoEnabled:
          type: boolean
        registrationEnabled:
          type: boolean
        emailVerificationRequired:
          type: boolean
        mailEnabled:
          type: boolean
      required:
      - demoEnabled
      - registrationEnabled
      - emailVerificationRequired
      - mailEnabled
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    AccountSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastAccessedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
      required:
      - id
      - createdAt
      - lastAccessedAt
      - expiresAt
      - current
    Register:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          description: At most 72 UTF-8 bytes; required text must be nonblank.
          maxLength: 72
      required:
      - name
      - email
      - password
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
      required:
      - email
      - password
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    TokenRequest:
      type: object
      properties:
        token: *id005
      required:
      - token
    ResetPassword:
      type: object
      properties:
        token: *id005
        password:
          type: string
          minLength: 12
          description: At most 72 UTF-8 bytes.
          maxLength: 72
      required:
      - token
      - password
    UpdateAccount:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    ChangePassword:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
        newPassword:
          type: string
          minLength: 12
          description: At most 72 UTF-8 bytes; changing a password revokes all existing sessions.
          maxLength: 72
      required:
      - currentPassword
      - newPassword
    Workspace:
      type: object
      properties:
        id: &id006
          type: string
          format: uuid
        name: &id007
          type: string
          maxLength: 100
        role: &id008
          type: string
          enum:
          - OWNER
          - MEMBER
          - VIEWER
        createdAt: &id009
          type: string
          format: date-time
      required:
      - id
      - name
      - role
      - createdAt
    WorkspaceSettings:
      type: object
      properties:
        id: *id006
        name: *id007
        role: *id008
        createdAt: *id009
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - name
      - role
      - createdAt
      - version
    CreateWorkspace:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    UpdateWorkspace:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - name
      - version
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum:
          - OWNER
          - MEMBER
          - VIEWER
      required:
      - id
      - name
      - email
      - role
    AddMember:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum:
          - MEMBER
          - VIEWER
      required:
      - email
      - role
    UpdateMember:
      type: object
      properties:
        role:
          type: string
          enum:
          - OWNER
          - MEMBER
          - VIEWER
      required:
      - role
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        taskCount:
          type: integer
          format: int64
          minimum: 0
        completedTaskCount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - name
      - description
      - color
      - status
      - taskCount
      - completedTaskCount
      - createdAt
      - version
    CreateProject:
      type: object
      properties:
        name: &id010
          type: string
          minLength: 1
          maxLength: 120
        description: &id011
          type:
          - string
          - 'null'
          maxLength: 2000
        color: &id012
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
      required:
      - name
      - color
    UpdateProject:
      type: object
      properties:
        name: *id010
        description: *id011
        color: *id012
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - name
      - color
      - status
      - version
    CreateTask:
      type: object
      properties:
        title: &id015
          type: string
          minLength: 1
          maxLength: 200
        description: &id016
          type:
          - string
          - 'null'
          maxLength: 10000
        projectId: &id017
          type: string
          format: uuid
        status: *id013
        priority: *id014
        assigneeId: &id018
          type:
          - string
          - 'null'
          format: uuid
        dueDate: &id019
          type:
          - string
          - 'null'
          format: date
          description: Calendar date in years 0001–9999; null clears the deadline.
      required:
      - title
      - projectId
      - status
      - priority
    UpdateTask:
      type: object
      properties:
        title: *id015
        description: *id016
        projectId: *id017
        status: *id013
        priority: *id014
        assigneeId: *id018
        dueDate: *id019
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - title
      - projectId
      - status
