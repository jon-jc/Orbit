        '413':
          $ref: '#/components/responses/Problem413'
        '500':
          $ref: '#/components/responses/Problem500'
      parameters:
      - *id002
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMember'
    delete:
      operationId: removeMember
      tags:
      - Team
      summary: 'Owner: remove member and clear assignments'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: No content
        '400':
