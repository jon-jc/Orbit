# Isolated development SMTP sink. It cannot relay mail to real recipients.
# Start with: docker compose -f compose.dev.yaml up -d
services:
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
