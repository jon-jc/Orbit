spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
server:
  servlet:
    session:
      cookie:
        secure: ${ORBIT_SESSION_SECURE:true}
management:
  server:
    port: 9091
    address: 127.0.0.1
orbit:
  demo:
    enabled: false
  accounts:
    registration-enabled: ${ORBIT_REGISTRATION_ENABLED:true}
    email-verification-required: ${ORBIT_EMAIL_VERIFICATION_REQUIRED:true}
    public-base-url: ${ORBIT_PUBLIC_BASE_URL}
    reset-token-ttl: 30m
    verification-token-ttl: 24h
    token-send-cooldown: 1m
logging:
  structured:
    format:
      console: ecs
