spring:
  application:
    name: orbit
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    validate-on-migrate: true
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: '0 */5 * * * *'
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        name: ORBIT_SESSION
        http-only: true
        same-site: lax
        secure: ${ORBIT_SESSION_SECURE:false}
  tomcat:
    max-http-form-post-size: 64KB
    threads:
      max: 100
  max-http-request-header-size: 16KB
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: orbit
orbit:
  demo:
    enabled: false
  auth:
    rate-limit-enabled: true
  accounts:
    public-base-url: ${ORBIT_PUBLIC_BASE_URL:http://127.0.0.1:8080}
    registration-enabled: ${ORBIT_REGISTRATION_ENABLED:true}
    email-verification-required: ${ORBIT_EMAIL_VERIFICATION_REQUIRED:false}
    token-send-cooldown: 1m
  mail:
    enabled: ${ORBIT_MAIL_ENABLED:false}
    host: ${ORBIT_MAIL_HOST:}
    port: ${ORBIT_MAIL_PORT:587}
    username: ${ORBIT_MAIL_USERNAME:}
    password: ${ORBIT_MAIL_PASSWORD:}
    from: ${ORBIT_MAIL_FROM:}
    starttls: ${ORBIT_MAIL_STARTTLS:true}
    encryption-key: ${ORBIT_MAIL_ENCRYPTION_KEY:}
    dispatch-delay-ms: 5000
logging:
  level:
    root: INFO
    com.orbit: INFO
